<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Installable app (PWA): Android, iPhone/iPad, Windows, macOS, ChromeOS -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1c7a72" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MediVerse" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="MediVerse — one platform for appointments, doctors, bed availability, medication tracking, vaccination alerts, and hospital campaigns."
    />
    <title>MediVerse | Unified Hospital Services</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mediverse-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Static, hidden duplicate of the React support form so Netlify's build-time
      bot can detect it in the raw HTML (it never sees the JS-rendered version).
      The live form in src/pages/Support.jsx submits to this same form name.
    -->
    <form name="support" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="category">
        <option>Technical issue / bug</option>
        <option>Appointment problem</option>
        <option>Doctor or bed information</option>
        <option>Medication or vaccination records</option>
        <option>Account issue</option>
        <option>Other</option>
      </select>
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <!-- Same reasoning as the support form above, for Emergency's ambulance-request form. -->
    <form name="emergency" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="phone" />
      <input type="text" name="name" />
      <input type="text" name="area" />
      <textarea name="details"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
